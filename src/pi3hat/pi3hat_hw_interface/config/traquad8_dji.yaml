controller_manager:
  ros__parameters:
    update_rate: 500

    state_broadcaster:
      type: pi3hat_state_broadcaster/Pi3HatStateBroadcaster

    distributor_state_broadcaster:
      type: distributor_state_broadcaster/DistributorStateBroadcaster

    debug_broadcaster:
      type: debug_broadcaster/DebugBroadcaster

    imu_sensor:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    joint_controller:
      type: pi3hat_joint_group_controller/Pi3HatJointGroupController

    omni_controller:
      type: omni_controller/OmniController

state_broadcaster:
  ros__parameters:
    joints:
      - "LF_HFE"
      # - "LF_KFE"
      - "LH_HFE"
      # - "LH_KFE"
      - "RF_HFE"
      # - "RF_KFE"
      - "RH_HFE"
      # - "RH_KFE"
      - "LF_WHEEL"
      - "LH_WHEEL"
      - "RF_WHEEL"
      - "RH_WHEEL"

    # second_encoders:
    #     - "LF_HFE"
    #     - "LF_KFE"
    #     - "LH_HFE"
    #     - "LH_KFE"
    #     - "RF_HFE"
    #     - "RF_KFE"
    #     - "RH_HFE"
    #     - "RH_KFE"

    performance_index: true

distributor_state_broadcaster:
  ros__parameters:
    distributors:
      - "Distributor_R"
      - "Distributor_L"

# TODO: verify the correct frame_id and sensor_name for the IMU
