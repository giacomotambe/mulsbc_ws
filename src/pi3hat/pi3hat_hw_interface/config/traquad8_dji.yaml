      - "RF_WHEEL"
      - "RH_WHEEL"

omni_controller:
  ros__parameters:
    velocity_lpf:
      enabled: True # Enable or disable the filter (default: false)
      cutoff_freq: 2.0 # [Hz]
    wheel_joints:
      LEFT:  [LF_WHEEL, LH_WHEEL]
      RIGHT: [RF_WHEEL, RH_WHEEL]

    joints:
      - LF_HFE
      # - LF_KFE
      - LH_HFE
      # - LH_KFE
      - RF_HFE
      # - RF_KFE
      - RH_HFE
      # - RH_KFE

    distributor_names:
      - Distributor_R
      - Distributor_L

    # second_encoder_joints:
    #     - LF_HFE
    #     - LF_KFE
    #     - LH_HFE
    #     - LH_KFE
    #     - RF_HFE
    #     - RF_KFE
    #     - RH_HFE
    #     - RH_KFE

    # Transitions (rest / stand / activation) — durations for interpolations
    rest_duration: 5.0 # [s] time to interpolate from stand to rest pose (0 disables transitions)
    stand_duration: 5.0 # [s] time to interpolate from rest to stand pose (0 disables transitions)
    activation_duration: 1.0 # [s] time to raise HFE joints during controller activation (0 disables)
    activation_hip_offset_deg: 7.5 # [deg] HFE offset raised during activation (applied to LF/LH/RF/RH_HFE)
    joint_targets:
      LF_HFE: { q_rest: 0.0, q_stand: 1.6 }
      # LF_KFE: { q_rest: 0.0, q_stand: 1.8 }
      LH_HFE: { q_rest: 0.0, q_stand: -1.6 }
      # LH_KFE: { q_rest: 0.0, q_stand: -1.8 }
      RF_HFE: { q_rest: 0.0, q_stand: -1.6 }
      # RF_KFE: { q_rest: 0.0, q_stand: -1.8 }
      RH_HFE: { q_rest: 0.0, q_stand: 1.6 }
      # RH_KFE: { q_rest: 0.0, q_stand: 1.8 }
    transition_wheels:
      mode: assist # "lock" = wheels braked during transitions (default); "assist" = tracks driven on STAND/REST
      gain: 10.0 # k: ω_track = −k · q̇_HFE (same leg)

    # Wheel IK
    wheel_mode: ik # Wheel control mode: "ik" (twist → WheelIK) or "direct" (per-wheel velocity)
    feet_type: traquad # Wheel IK type: "mecanum", "differential", "traquad" (differential + shoulder joints), or "none"
    twist_max_x: 1.0 # [m/s] twist clamp (default 0.5): 22 rad/s at the tracks with wheel_rad 0.045, below their max_velocity 25 (traquad8_dji.xacro)
    wheel_rad: 0.045 # Track joint radius [m]: belt speed per rad/s of the track joint. Qualisys 2026-10-22: base speed / (joint speed x 0.028) = 1.61-1.63 on 7 straight runs, so 0.028 x 1.62 = 0.045
    traquad: # feet_type: traquad only. Fitted with the Qualisys on three runs of 2026-10-22 (standing, joystick,
      # R2 and compliant IK mode), leave-one-run-out: yaw rate error 3.9 % (median, was 7.3 % with γ·X̄), vx 1.7 cm/s
      # A. kinematics: y_eff = max(yaw_half_track − yaw_posture_gain·|δ|, track_width/2), δ = mean q_HFE (measured);
      #    vx' = vx − spin_forward_drift·|ωz|;  V_L,R = vx' ∓ y_eff·ωz;  ω_i = κ_i·V / wheel_rad
      yaw_half_track: 0.556 # y0 [m]: effective half track standing (real 0.537 turning in place at |δ| < 0.05)
      yaw_posture_gain: 0.302 # kδ [m/rad]: yaw posture lowers y_eff (real 0.454 at |δ| 0.25-0.45, R2 / IK mode)
      spin_forward_drift: 0.066 # d [m/rad]: the robot creeps forward by d·|ωz| while turning, either way
      # B. track deficit: the drives (Kd only) run Δ slower than commanded; each command is raised by
      #    Δ = base + speed·|ω| + load·(turn ± side) [rad/s], + outer / − inner track, load 0 straight .. 1 turning
      #    in place (measured: straight 1.2-1.5, arc inner 1.0, arc outer 1.7-1.9, spin 2.0-2.3; CV rms 0.39)
      deficit_compensation:
        enabled: false # true: the robot follows the commanded twist (91 % vx, 74-88 % ωz without)
        base: 1.215 # [rad/s]
        speed: 0.025 # [rad/s per rad/s]
        turn: -0.221 # [rad/s]
        side: 0.939 # [rad/s]
        fade: 1.0 # [rad/s] Δ faded to 0 below this track speed
    driveshaft_x: 0.235 # Longitudinal distance from base center to wheel [m]
    driveshaft_y: 0.188 # Lateral distance from base center to wheel [m]
    mecanum_angle: 135.0 # Mecanum roller angle [deg] (only used with feet_type: mecanum)

    # Communication
    input_frequency: 100 # Expected twist command rate [Hz] (sets deadline QoS)
    BestEffort_QOS: true # true = BestEffort QoS, false = Reliable QoS for twist subscriber

    # Features
    sim: false # true = skip hardware, accept commands without real motors
    pub_odom: false # Publish wheel odometry on ~/odom
    pub_performance: true # Publish CAN packet loss & cycle duration on ~/performance

    safety:
      enabled: true
      temp_warning_threshold: 50.0 # [C] motor temp above this triggers throttling (kp/kd halved)
      temp_critical_threshold: 60.0 # [C] motor temp above this triggers the critical_strategy
      battery_min_voltage: 20.5 # [V] distributor voltage below this triggers the critical_strategy
      temp_recovery_hysteresis: 1.0 # [C] temp must drop below (warning - hysteresis) to recover
      volt_recovery_hysteresis: 0.5 # [V] voltage must rise above (min + hysteresis) to recover
      ema_window_samples: 5000 # EMA filter length for temp/voltage; averages over ema_window_samples / update_rate seconds
      # Action on critical fault: "damping" (ramp to zero), "stop" (immediate zero), "default_config" (apply default kp/kd)
      critical_strategy: "default_config"
      damping_duration: 10.0 # [s] ramp-down time when critical_strategy is "damping"
      joints_reference_timeout: 0.5 # [s] if no joint reference received for this long, hold last leg position
      heartbeat_timeout: 1.0 # [s] NUC heartbeat timeout; 0 disables (only checked after first heartbeat)
